---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-mirror-config
  namespace: gitea-mirror
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # gitea-mirror only stores its own better-sqlite DB + logs here (the
      # mirrored git repos live in the target Forgejo, not on this PVC), so the
      # OCP 40Gi request is vastly oversized. Shrunk to 2Gi on local-path for
      # the stop-gap; bump/move to freenas-iscsi-ssd-csi for a real deploy.
      storage: 2Gi
  storageClassName: local-path
