apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitea-mirror
resources:
  - gitea-mirror-namespace.yaml
  - gitea-mirror-config-pvc.yaml
  - gitea-mirror-secrets-externalsecret.yaml
helmCharts:
  - name: app-template
    namespace: gitea-mirror
    version: 4.6.2
    releaseName: gitea-mirror
    repo: oci://ghcr.io/bjw-s-labs/helm
    valuesFile: values-dummy.yaml
    valuesInline:
      controllers:
        gitea-mirror:
          type: deployment
          replicas: 1
          strategy: RollingUpdate
          pod:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
              # local-path PVC mounted at /app/data (the better-sqlite DB). The
              # image's data dir is owned gitea-mirror:nodejs (1001:1001); fsGroup
              # makes the kubelet chown the volume group so the non-root UID can
              # write the DB.
              fsGroup: 1001
          containers:
            app:
              image:
                repository: ghcr.io/raylabshq/gitea-mirror
                tag: v3.15.6@sha256:ad2d7f59d2616edd7e0907c8feb07e6e08199b4818c711ee9c7b06df9600b442
                pullPolicy: IfNotPresent
              env:
                NODE_ENV: production
                HOST: 0.0.0.0
                PORT: "4321"
                DATABASE_URL: file:/app/data/gitea-mirror.db
                # OCP pointed better-auth at the public Route host
                # (gitea-mirror.apps.ocp.igou.systems). No ingress on rk8s, so
                # retargeted to the in-cluster Service DNS.
                BETTER_AUTH_URL: http://gitea-mirror.gitea-mirror.svc.cluster.local:4321
                PUBLIC_BETTER_AUTH_URL: http://gitea-mirror.gitea-mirror.svc.cluster.local:4321
                BETTER_AUTH_TRUSTED_ORIGINS: http://gitea-mirror.gitea-mirror.svc.cluster.local:4321
                # OCP ran SCHEDULE_ENABLED/AUTO_IMPORT_REPOS=true (mass-imports &
                # mirrors ALL of the GitHub account's repos on startup). The rk8s
                # Forgejo target is a fresh empty instance and the account has 100+
                # repos, so auto-import is disabled for the stop-gap to avoid
                # flooding it; enable both for a real curated migration.
                AUTO_IMPORT_REPOS: "false"
                SCHEDULE_ENABLED: "false"
                SCHEDULE_INTERVAL: "0 4 * * *"
                # Cleanup disabled + dry-run: OCP had DELETE_IF_NOT_IN_GITHUB=true
                # which would archive Forgejo repos absent from GitHub. Disabled so
                # the port can never take a destructive action on the shared Forgejo.
                CLEANUP_DELETE_IF_NOT_IN_GITHUB: "false"
                CLEANUP_ORPHANED_REPO_ACTION: archive
                CLEANUP_DRY_RUN: "true"
              envFrom:
                - secretRef:
                    name: gitea-mirror-secrets
              probes:
                liveness:
                  enabled: true
                  type: HTTP
                  path: /api/health
                  port: 4321
                readiness:
                  enabled: true
                  type: HTTP
                  path: /api/health
                  port: 4321
                startup:
                  enabled: true
                  type: HTTP
                  path: /api/health
                  port: 4321
                  spec:
                    failureThreshold: 30
                    periodSeconds: 10
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                # The image's USER is the named account `gitea-mirror` (UID 1001,
                # GID 1001/nodejs). kubelet cannot verify a non-numeric USER is
                # non-root under runAsNonRoot (no SCC on k3s), so pin the numeric
                # UID/GID explicitly.
                runAsUser: 1001
                runAsGroup: 1001
                capabilities:
                  drop:
                    - ALL
      persistence:
        config:
          type: persistentVolumeClaim
          existingClaim: gitea-mirror-config
          advancedMounts:
            gitea-mirror:
              app:
                - path: /app/data
      service:
        app:
          controller: gitea-mirror
          ports:
            http:
              port: 4321
              targetPort: 4321
      serviceAccount:
        gitea-mirror:
          enabled: true
