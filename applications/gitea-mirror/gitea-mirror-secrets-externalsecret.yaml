---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-mirror-secrets
  namespace: gitea-mirror
spec:
  refreshInterval: 24h
  # OCP pulled this from ClusterSecretStore onepassword-lab-github. The GitHub
  # PAT is an external API credential, so retargeted to the rk8s external-API-key
  # store. The 1Password item `gitea-mirror` is NOT present in this vault (op
  # CLI: 0 items) -> ExternalSecret reports SecretSyncedError; a plain
  # gitea-mirror-secrets Secret is hand-created for live testing. For a real
  # migration, create item `gitea-mirror` (fields GITHUB_USERNAME, GITHUB_TOKEN,
  # GITHUB_TYPE, GITEA_URL, GITEA_TOKEN, GITEA_USERNAME) in lab_external_api_keys.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-external-api-keys
  target:
    name: gitea-mirror-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: gitea-mirror
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
