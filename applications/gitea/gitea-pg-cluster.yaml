---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-pg
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  enablePDB: false
  imagePullPolicy: IfNotPresent
  # rk8s adaptation: pin an explicit PostgreSQL major so the data plane is
  # reproducible rather than floating with the operator default. PG18 matches
  # the rk8s CNPG 1.30.0 operator default (verified PostgreSQL 18.4 aarch64 in
  # phase 0). arm64-verified: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  # is a multi-arch index (linux/amd64 + linux/arm64). gitea was retired on OCP
  # (replaced by Forgejo) so there is NO live gitea DB to migrate — the major
  # is chosen for reproducibility, not data compatibility.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:802cb43a4d482acf1037b418e421c865b16959ba22e07f16fc003e06cb21084c
  bootstrap:
    initdb:
      database: gitea
      owner: gitea
  # rk8s adaptation: OCP used freenas-nvmeof-ssd-csi 10Gi. Shrunk to local-path
  # 2Gi for the stop-gap test (fresh DB, no data import). OCP's real requirement
  # was 10Gi on NVMe-oF SSD.
  storage:
    size: 2Gi
    storageClass: local-path
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
