---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin-secret
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  # rk8s adaptation: secretStoreRef retargeted onepassword-ocp-pull ->
  # onepassword-lab-rk8s. GAP: the 1Password item `gitea-admin` does NOT exist
  # in vault lab_rk8s (verified 0 items), so this ES reports SecretSyncedError
  # live. A plain `gitea-admin-secret` was hand-created with a generated admin
  # password for the functional test. Real migration: create item `gitea-admin`
  # (fields username/password/email) in vault lab_rk8s and ESO will own it.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    name: gitea-admin-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        email: "{{ .email }}"
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: gitea-admin
        metadataPolicy: None
        nullBytePolicy: Ignore
