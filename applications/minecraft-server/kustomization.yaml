apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minecraft-server
# Ported from igou-openshift/applications/minecraft-server. rk8s (k3s/arm64)
# adaptations:
#   - Game + RCON services NodePort -> ClusterIP (no ingress in this effort; a
#     real migration needs a MetalLB LoadBalancer to expose 25565 to players).
#   - Resources slashed for 16Gi RK3588 boards: MEMORY (JVM heap) 28500M -> 3G,
#     container request 30Gi/4cpu -> 4Gi/1cpu, limit 5Gi (heap <= 4G per board
#     budget).
#   - Persistence storageClass lvms-vg1-worker -> local-path, 100Gi -> 20Gi
#     (fresh world; no world import from OCP).
#   - mcbackup sidecar DISABLED (rclone -> minio S3 with CHANGEME creds + a
#     5cpu request; no S3 backup in the stop-gap).
#   - Pl3xMap plugin + its extraPorts web-map (8080, tailscale-exposed) dropped
#     (tied to ingress/tailscale exposure that is out of scope).
#   - Enabled a generous startupProbe (10min) so the liveness probe does not
#     kill the pod during the slow first world generation on ARM.
#   - Dropped tailscale.com/expose service annotations.
#   - ExternalSecret store retargeted onepassword-lab-openshift ->
#     onepassword-lab-rk8s (item missing in vault; see findings).
# The chart templates {{ .Release.Namespace }} on every object, so no
# add-namespace patch is required (unlike the jellyfin chart).
resources:
  - minecraft-networkpolicy.yaml
  - minecraft-namespace.yaml
  - minecraft-exporter-service.yaml
  - minecraft-secrets-externalsecret.yml
helmCharts:
  - name: minecraft
    namespace: minecraft-server
    valuesFile: values-dummy.yaml
    releaseName: minecraft
    version: 5.1.3
    repo: https://itzg.github.io/minecraft-server-charts/
    valuesInline:
      image:
        repository: itzg/minecraft-server
        tag: latest@sha256:7fb066de722ad1b8dd05bb1681d68f7c89833c82990026ac084b515014b0aaa8
        pullPolicy: IfNotPresent
        pullSecret: ""

      replicaCount: 1

      # Slashed for the 16Gi RK3588 boards (OCP requested 30Gi/4cpu). JVM heap
      # (minecraftServer.memory) is 3G below; request 4Gi to cover heap +
      # non-heap, limit 5Gi headroom. No CPU limit: allow burst during worldgen.
      resources:
        requests:
          memory: 4Gi
          cpu: "1"
        limits:
          memory: 5Gi

      lifecycle:
        postStart: []
        preStop: []

      workloadAsStatefulSet: false
      strategyType: Recreate

      tolerations: []
      affinity: {}

      extraPodSpec:
        automountServiceAccountToken: "false"

      # Explicit non-root UID/GID (the itzg image runs as UID 1000 by default;
      # k3s has no SCC to assign one dynamically). fsGroup chowns the local-path
      # /data volume so the server can write the world.
      podSecurityContext:
        runAsUser: 1000
        runAsGroup: 3000
        runAsNonRoot: true
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault

      securityContext:
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false

      livenessProbe:
        command:
          - mc-health
        initialDelaySeconds: 30
        periodSeconds: 5
        failureThreshold: 20
        successThreshold: 1
        timeoutSeconds: 1
      readinessProbe:
        command:
          - mc-health
        initialDelaySeconds: 30
        periodSeconds: 5
        failureThreshold: 20
        successThreshold: 1
        timeoutSeconds: 1
      # ENABLED (OCP left it off): first world generation is slow on ARM, so give
      # the server up to ~10min to reach healthy before liveness/readiness start.
      startupProbe:
        command:
          - mc-health
        enabled: true
        failureThreshold: 60
        periodSeconds: 10

      initContainers: []

      sidecarContainers:
        - name: minecraft-exporter
          image: ghcr.io/dirien/minecraft-exporter:0.22.0@sha256:a1d1da2e2f91631c6dc4806bef54c234750af9ac63af3761230f97a67d4681fa
          imagePullPolicy: IfNotPresent
          env:
            - name: MC_RCON_ADDRESS
              value: ":25575"
            - name: MC_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: rcon-password
            - name: MC_NAME_SOURCE
              value: "mojang"
            - name: MC_MOD_SERVER_STATS
              value: "papermc"
            - name: MC_WORLD
              value: "/data/world"
          ports:
            - name: metrics
              containerPort: 9150
              protocol: TCP
          volumeMounts:
            - name: datadir
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault

      extraVolumes: []
      extraDeploy: []

      minecraftServer:
        eula: "TRUE"
        version: "1.21.8"
        type: "PAPER"
        difficulty: easy
        ops: "count_cocofang"
        maxPlayers: 20
        maxWorldSize: 10000
        maxBuildHeight: 256
        maxTickTime: 60000
        spawnProtection: 16
        viewDistance: 20
        gameMode: survival
        motd: "Welcome to Nick's Shed"
        levelType: DEFAULT
        worldSaveName: world
        forceReDownload: false
        removeOldMods: false
        onlineMode: default
        # JVM heap. OCP ran 28500M; capped to 3G for the 16Gi boards.
        memory: "3G"
        jvmOpts: ""
        jvmXXOpts: ""
        overrideServerProperties: true

        # Game service: NodePort -> ClusterIP for this in-cluster test. A real
        # migration needs a MetalLB LoadBalancer to expose 25565 to players.
        serviceAnnotations: {}
        serviceType: ClusterIP
        servicePort: 25565

        # Pl3xMap plugin dropped: its only purpose was the web map on the
        # extraPorts 8080 service (tailscale-exposed), which is out of scope.
        modUrls: []
        pluginUrls: []
        spigetResources: []
        extraServiceSpec: {}

        modrinth:
          projects: []
          optionalDependencies: false
          allowedVersionType: release

        rcon:
          enabled: true
          withGeneratedPassword: false
          port: 25575
          existingSecret: minecraft-secrets
          secretKey: rcon-password
          # NodePort -> ClusterIP (in-cluster only).
          serviceType: ClusterIP

        query:
          enabled: false
          port: 25565

      extraEnv: {}
      envFrom: []

      persistence:
        labels: {}
        annotations: {}
        # OCP used lvms-vg1-worker; local-path keeps the world on the scheduling
        # node's SSD. Fresh world (no OCP world import) -> 20Gi is ample.
        storageClass: "local-path"
        dataDir:
          enabled: true
          Size: 20Gi

      podAnnotations: {}
      podLabels: {}
      deploymentAnnotations: {}
      deploymentLabels: {}
      # OCP set tailscale.com/expose; dropped (no tailscale exposure here).
      serviceAnnotations: {}
      serviceLabels: {}
      rconServiceAnnotations: {}
      rconServiceLabels: {}

      # mcbackup DISABLED: OCP backed up via rclone -> minio S3 (CHANGEME creds,
      # 5cpu request). No S3 backup in the stop-gap (recorded as a gap).
      mcbackup:
        enabled: false
