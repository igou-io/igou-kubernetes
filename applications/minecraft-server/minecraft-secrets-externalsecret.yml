apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-secrets
spec:
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: minecraft-secrets
        metadataPolicy: None
  refreshInterval: 24h
  # Retargeted from OCP ClusterSecretStore onepassword-lab-openshift to the rk8s
  # store. NOTE: the `minecraft-secrets` item does not currently exist in the
  # lab_rk8s vault, so this ES reports SecretSyncedError live; a plain Secret is
  # hand-created for testing (rcon-password). See migration findings.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
