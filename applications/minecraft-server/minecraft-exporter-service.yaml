apiVersion: v1
kind: Service
metadata:
  name: minecraft-exporter
spec:
  # OCP used NodePort + a tailscale.com/expose annotation; on rk8s this is a
  # plain in-cluster ClusterIP (no ingress/tailscale exposure in this effort).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minecraft
    app.kubernetes.io/instance: minecraft
  ports:
    - name: metrics
      port: 9150
      targetPort: metrics
