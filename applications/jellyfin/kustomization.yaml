apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jellyfin
# Ported from igou-openshift/applications/jellyfin. rk8s (k3s/arm64) adaptations:
#   - Dropped i915 GPU limit + the ocp.igou.systems nodeSelector: RK3588 SBCs
#     expose no jellyfin-supported HW transcode path (the VPU is not surfaced
#     to jellyfin/ffmpeg), so this runs CPU-only / direct-play. See findings.
#   - Service LoadBalancer + MetalLB VIP annotations + externalTrafficPolicy
#     -> plain ClusterIP (no ingress in this migration effort).
#   - Dropped the HTTPRoute, the namespace gateway-access label, and the
#     blackbox Probe (all tied to the OCP guest-dmz Gateway).
#   - Media NFS volume mount removed (export ACL blocks rk8s nodes — see
#     jellyfin-media-nfs-pv.yaml). Chart's default emptyDir /media is used
#     instead, so the server starts with an empty library. The PV/PVC are kept
#     for migration reference and bind harmlessly.
#   - Config PVC storageClass freenas-nvmeof-ssd-csi -> local-path.
#   - Added explicit runAsUser/runAsGroup/fsGroup (no SCC on k3s to assign a
#     UID dynamically).
resources:
  - jellyfin-namespace.yaml
  - jellyfin-media-nfs-pv.yaml
  - jellyfin-media-nfs-pvc.yaml
  - jellyfin-config-pvc.yaml
helmCharts:
  - name: jellyfin
    namespace: jellyfin
    version: 3.2.0
    releaseName: jellyfin
    repo: https://jellyfin.github.io/jellyfin-helm/
    valuesInline:
      replicaCount: 1
      image:
        repository: docker.io/jellyfin/jellyfin
        tag: 10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
        pullPolicy: IfNotPresent
      serviceAccount:
        create: true
        automount: true
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
        # No SCC on k3s: pin an explicit non-root UID/GID (the image runs as
        # root by default and never drops privileges) and fsGroup so kubelet
        # chowns the local-path /config volume group-writable.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Retained from OCP: the TrueNAS media group so the pod can read the
        # NFS export once its export ACL admits rk8s nodes (see PV comment).
        supplementalGroups:
          - 797
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 2Gi
      deploymentStrategy:
        type: Recreate
      service:
        type: ClusterIP
        port: 8096
      ingress:
        enabled: false
      persistence:
        config:
          enabled: true
          existingClaim: jellyfin-config
        media:
          enabled: false
      jellyfin:
        enableDLNA: false
patches:
  # jellyfin-helm 3.2.0 renders its Deployment/Service/ServiceAccount without a
  # namespace, and kustomize's namespace transformer does not reach the
  # helm-inflated objects (only the hand-written PVCs get it), so without this
  # patch they land in `default`. Force the namespace on every chart resource.
  - target:
      labelSelector: app.kubernetes.io/instance=jellyfin
    patch: |
      - op: add
        path: /metadata/namespace
        value: jellyfin
