# Squid forward proxy — cluster-internal only, no disk cache

http_port 3128

# Standard port ACLs
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT

# RFC 1918 private networks + IPv6 ULA/link-local
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

# Clamp CONNECT to SSL ports only (prevents CONNECT tunneling to arbitrary ports)
http_access deny CONNECT !SSL_ports

# Deny requests to non-standard ports
http_access deny !Safe_ports

# Allow cluster-internal sources; deny everything else
http_access allow localnet
http_access deny all

# Container-friendly logging: access log to stdout, cache log to stderr
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr

# No disk cache — forward proxy only. Squid 6 dropped the `null` cache_dir
# type; simply omitting cache_dir means memory-only (cache_mem), which is
# what we want.

# Runtime write location (emptyDir mount)
coredump_dir /var/spool/squid

# No PID file: squid runs foreground (-N) as the container's sole process.
# A PID file on the emptyDir survives container restarts, and inside a PID
# namespace the recorded "PID 1" always exists — squid 6 then refuses to
# start ("Squid is already running"), wedging the pod in CrashLoopBackOff.
pid_filename none
