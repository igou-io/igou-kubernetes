---
# Hand-managed PodMonitor for the forgejo-pg CNPG instance (kept verbatim from
# OCP). PodMonitor CRD is present on rk8s (kube-prometheus-stack). Distinct name
# from the operator's default so the two can coexist.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: forgejo-pg-metrics
  namespace: forgejo
  labels:
    cnpg.io/cluster: forgejo-pg
spec:
  namespaceSelector: {}
  podMetricsEndpoints:
    - port: metrics
  selector:
    matchLabels:
      cnpg.io/cluster: forgejo-pg
      cnpg.io/podRole: instance
