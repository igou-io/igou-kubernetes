---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  # rk8s adaptation: secretStoreRef retargeted onepassword-lab-forgejo ->
  # onepassword-lab-rk8s. GAP: the 1Password item `forgejo-admin` does NOT exist
  # in vault lab_rk8s (verified 0 items), so this ES reports SecretSyncedError
  # live. A plain `forgejo-secrets` Secret was hand-created with a generated admin
  # password for the functional test. Real migration: create item `forgejo-admin`
  # (fields username/password/email) in vault lab_rk8s and ESO will own it.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    name: forgejo-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: forgejo-admin
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
