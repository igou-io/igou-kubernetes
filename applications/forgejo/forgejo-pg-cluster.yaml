---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-pg
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  enablePDB: false
  imagePullPolicy: IfNotPresent
  # rk8s adaptation: pin the SAME PostgreSQL MAJOR (18) as the LIVE OCP forgejo
  # database so a future barman/pg_dump restore of the real data is possible.
  # Verified against the live OCP cluster: forgejo-pg pod runs
  # ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie (PG18). Here we use the
  # arm64-verified 18.4-standard-trixie build (multi-arch index amd64 + arm64,
  # proven PostgreSQL 18.4 aarch64 in phase 0); major 18 == OCP, so pg_dump /
  # barman restore across the two is major-compatible.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:802cb43a4d482acf1037b418e421c865b16959ba22e07f16fc003e06cb21084c
  # rk8s adaptation: DROPPED the OCP affinity.nodeSelector pinning to
  # node-role.kubernetes.io/control-plane (existed to keep the RWO NVMe-oF PVC on
  # the always-present OCP control-plane host and dodge the democratic-csi
  # Multi-Attach bug). On local-path the PVC is node-local anyway (WaitForFirst-
  # Consumer), so no anti-migration pin is needed.
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  # rk8s adaptation: OCP used freenas-nvmeof-ssd-csi 10Gi. Shrunk to local-path
  # 2Gi for the stop-gap (fresh empty DB, no data import). OCP's real requirement
  # was 10Gi on NVMe-oF SSD (live DB backing ~28Gi of repos).
  storage:
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # rk8s adaptation: DROPPED the OCP `plugins: [barman-cloud.cloudnative-pg.io]`
  # WAL-archiver block. There is no S3/Barman ObjectStore target on rk8s (the
  # cloudnative-pg-barman-plugin is not installed), and referencing a missing
  # plugin would keep the Cluster perpetually unhealthy (archiving-blocked). No
  # backups for the stop-gap — recorded as a gap.
