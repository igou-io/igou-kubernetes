---
apiVersion: v1
kind: Service
metadata:
  name: ocp-udp-echo-bridge
  namespace: tailscale
spec:
  type: ClusterIP
  selector:
    tailscale.com/managed: 'true'
    tailscale.com/parent-resource-type: svc
    tailscale.com/parent-resource: ocp-udp-echo
    tailscale.com/parent-resource-ns: public-services
  ports:
    - name: udp
      port: 9000
      targetPort: 9000
      protocol: UDP
