---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocp-tcp-hostname
  namespace: tailscale
spec:
  podSelector:
    matchLabels:
      tailscale.com/managed: 'true'
      tailscale.com/parent-resource-type: svc
      tailscale.com/parent-resource: ocp-tcp-hostname
      tailscale.com/parent-resource-ns: public-services
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: public
      ports:
        - port: 9000
          protocol: TCP
