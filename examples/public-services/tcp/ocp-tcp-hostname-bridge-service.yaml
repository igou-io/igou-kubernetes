---
apiVersion: v1
kind: Service
metadata:
  name: ocp-tcp-hostname-bridge
  namespace: tailscale
spec:
  type: ClusterIP
  selector:
    tailscale.com/managed: 'true'
    tailscale.com/parent-resource-type: svc
    tailscale.com/parent-resource: ocp-tcp-hostname
    tailscale.com/parent-resource-ns: public-services
  ports:
    - name: tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
