---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocp-public-web-test
  namespace: tailscale
spec:
  podSelector:
    matchLabels:
      tailscale.com/managed: 'true'
      tailscale.com/parent-resource-type: svc
      tailscale.com/parent-resource: ocp-public-web-test
      tailscale.com/parent-resource-ns: public-services
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
      ports:
        - port: 8080
          protocol: TCP
