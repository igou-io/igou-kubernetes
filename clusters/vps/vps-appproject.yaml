---
apiVersion: "argoproj.io/v1alpha1"
kind: "AppProject"
metadata:
  name: "vps"
  namespace: "openshift-gitops"
spec:
  description: "Dedicated VPS vps resources"
  sourceRepos:
    - "https://github.com/igou-io/igou-kubernetes.git"
  destinations:
    -
      namespace: "vps-system"
      server: "https://vps-k3s-api.tailscale.svc.cluster.local:6443"
    -
      namespace: "cert-manager"
      server: "https://vps-k3s-api.tailscale.svc.cluster.local:6443"
    -
      namespace: "tailscale"
      server: "https://vps-k3s-api.tailscale.svc.cluster.local:6443"
    -
      namespace: "nginx-gateway"
      server: "https://vps-k3s-api.tailscale.svc.cluster.local:6443"
    -
      namespace: "igou-io"
      server: "https://vps-k3s-api.tailscale.svc.cluster.local:6443"
    -
      namespace: "gotify"
      server: "https://vps-k3s-api.tailscale.svc.cluster.local:6443"
  clusterResourceWhitelist:
    -
      group: ""
      kind: "Namespace"
    -
      group: "apiextensions.k8s.io"
      kind: "CustomResourceDefinition"
    -
      group: "rbac.authorization.k8s.io"
      kind: "ClusterRole"
    -
      group: "rbac.authorization.k8s.io"
      kind: "ClusterRoleBinding"
    -
      group: "gateway.networking.k8s.io"
      kind: "GatewayClass"
    -
      group: "cert-manager.io"
      kind: "ClusterIssuer"
  namespaceResourceWhitelist:
    -
      group: "*"
      kind: "*"
