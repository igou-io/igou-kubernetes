---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nginx-gateway
resources:
  - https://github.com/nginx/nginx-gateway-fabric/config/crd/gateway-api/standard?ref=v2.7.2
  - public-nginx-metrics-service.yaml
  - metrics-reader-nginx-role.yaml
  - metrics-reader-nginx-rolebinding.yaml
helmCharts:
  - name: nginx-gateway-fabric
    releaseName: nginx-gateway
    namespace: nginx-gateway
    version: 2.7.2
    repo: oci://ghcr.io/nginx/charts
    includeCRDs: true
    valuesInline:
      nginxGateway:
        replicas: 1
        gatewayClassName: nginx
        gwAPIExperimentalFeatures:
          enable: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        productTelemetry:
          enable: false
        metrics:
          enable: true
      nginx:
        replicas: 1
        container:
          hostPorts:
            - port: 80
              containerPort: 80
            - port: 443
              containerPort: 443
            - port: 27010
              containerPort: 27010
            - port: 27011
              containerPort: 27011
            - port: 27012
              containerPort: 27012
            - port: 27013
              containerPort: 27013
            - port: 27014
              containerPort: 27014
            - port: 27015
              containerPort: 27015
            - port: 27016
              containerPort: 27016
            - port: 27017
              containerPort: 27017
            - port: 27018
              containerPort: 27018
            - port: 27019
              containerPort: 27019
            - port: 27020
              containerPort: 27020
            - port: 27021
              containerPort: 27021
            - port: 27022
              containerPort: 27022
            - port: 27023
              containerPort: 27023
            - port: 27024
              containerPort: 27024
            - port: 27025
              containerPort: 27025
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        service:
          type: ClusterIP
        patches:
          - type: StrategicMerge
            value:
              spec:
                strategy:
                  type: Recreate
                  rollingUpdate: null
