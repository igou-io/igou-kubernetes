---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-data-plane
  namespace: nginx-gateway
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: public
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 27010
          endPort: 27017
        - protocol: UDP
          port: 27018
          endPort: 27025
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: 'true'
      ports:
        - protocol: TCP
          port: 9113
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-gateway-fabric
              app.kubernetes.io/instance: nginx-gateway
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: 'true'
              tailscale.com/parent-resource-type: svc
              tailscale.com/parent-resource-ns: public-services
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: igou-io
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gotify
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
