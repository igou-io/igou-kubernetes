---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aap-public-share-public-services
  namespace: public-services
rules:
  - apiGroups:
      - ''
    resources:
      - services
    verbs:
      - get
      - list
      - create
      - patch
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
      - tcproutes
      - udproutes
    verbs:
      - get
      - list
      - create
      - patch
      - delete
