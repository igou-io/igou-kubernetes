---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aap-public-share-tailscale
  namespace: tailscale
rules:
  - apiGroups:
      - ''
    resources:
      - services
    verbs:
      - get
      - list
      - create
      - patch
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - referencegrants
    verbs:
      - get
      - list
      - create
      - patch
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - create
      - patch
      - delete
