---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vps-secrets
  namespace: openshift-gitops
spec:
  provider:
    kubernetes:
      remoteNamespace: external-secrets
      server:
        url: https://vps-k3s-api.vps-secrets.svc.cluster.local:6443
        caProvider:
          type: Secret
          name: vps-secrets
          key: ca.crt
      auth:
        token:
          bearerToken:
            name: vps-secrets
            key: argocd-token
