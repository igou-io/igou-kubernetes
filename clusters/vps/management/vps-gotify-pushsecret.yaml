---
apiVersion: "external-secrets.io/v1alpha1"
kind: "PushSecret"
metadata:
  name: "vps-gotify"
  namespace: "vps-secrets"
spec:
  refreshInterval: "5m"
  updatePolicy: "Replace"
  deletionPolicy: "None"
  secretStoreRefs:
    -
      name: "vps-gotify"
      kind: "SecretStore"
  selector:
    secret:
      name: "vps-gotify-source"
  data:
    -
      match:
        secretKey: "password"
        remoteRef:
          remoteKey: "gotify-admin"
          property: "password"
