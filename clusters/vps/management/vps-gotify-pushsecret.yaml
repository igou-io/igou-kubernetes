---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vps-gotify
  namespace: openshift-gitops
spec:
  refreshInterval: 5m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: vps-secrets
      kind: SecretStore
  selector:
    secret:
      name: vps-gotify-source
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: vps-gotify
          property: password
