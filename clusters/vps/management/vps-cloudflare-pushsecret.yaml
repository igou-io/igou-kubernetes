---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vps-cloudflare
  namespace: openshift-gitops
spec:
  refreshInterval: 5m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: vps-secrets
      kind: SecretStore
  selector:
    secret:
      name: vps-cloudflare-source
  data:
    - match:
        secretKey: api-token
        remoteRef:
          remoteKey: vps-cloudflare
          property: api-token
