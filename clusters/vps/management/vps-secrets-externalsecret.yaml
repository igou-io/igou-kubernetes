---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vps-secrets
  namespace: openshift-gitops
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: vps-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        argocd-token: "{{ .argocd_token }}"
        ca.crt: "{{ .ca_data | b64dec }}"
  data:
    - secretKey: argocd_token
      remoteRef:
        key: vps-k3s
        property: argocd_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: ca_data
      remoteRef:
        key: vps-k3s
        property: ca_data
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
