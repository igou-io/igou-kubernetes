---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vps-cluster
  namespace: vps-gitops
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: vps-cluster
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
      data:
        name: vps
        server: https://vps-k3s-api.vps-secrets.svc.cluster.local:6443
        config: >-
          {"bearerToken":{{ .argocd_token | toJson }},"tlsClientConfig":{"insecure":false,"caData":{{ .ca_data | toJson }}}}
  data:
    - secretKey: argocd_token
      remoteRef:
        key: vps-k3s
        property: argocd_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: ca_data
      remoteRef:
        key: vps-k3s
        property: ca_data
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
