---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vps-cert-manager
  namespace: vps-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: cert-manager
      server:
        url: https://vps-k3s-api.vps-secrets.svc.cluster.local:6443
        caProvider:
          type: Secret
          name: vps-connection
          key: ca.crt
      auth:
        token:
          bearerToken:
            name: vps-connection
            key: eso-token
