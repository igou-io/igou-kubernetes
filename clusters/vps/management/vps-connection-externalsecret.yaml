---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vps-connection
  namespace: vps-secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-agents
  target:
    name: vps-connection
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        eso-token: "{{ .eso_token }}"
        ca.crt: "{{ .ca_data | b64dec }}"
  data:
    - secretKey: eso_token
      remoteRef:
        key: vps-k3s
        property: eso_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: ca_data
      remoteRef:
        key: vps-k3s
        property: ca_data
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
