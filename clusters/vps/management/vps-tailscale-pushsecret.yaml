---
apiVersion: "external-secrets.io/v1alpha1"
kind: "PushSecret"
metadata:
  name: "vps-tailscale"
  namespace: "vps-secrets"
spec:
  refreshInterval: "5m"
  updatePolicy: "Replace"
  deletionPolicy: "None"
  secretStoreRefs:
    -
      name: "vps-tailscale"
      kind: "SecretStore"
  selector:
    secret:
      name: "vps-tailscale-source"
  data:
    -
      match:
        secretKey: "client_id"
        remoteRef:
          remoteKey: "operator-oauth"
          property: "client_id"
    -
      match:
        secretKey: "client_secret"
        remoteRef:
          remoteKey: "operator-oauth"
          property: "client_secret"
