---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vps-tailscale
  namespace: openshift-gitops
spec:
  refreshInterval: 5m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: vps-secrets
      kind: SecretStore
  selector:
    secret:
      name: vps-tailscale-source
  data:
    - match:
        secretKey: client_id
        remoteRef:
          remoteKey: vps-tailscale
          property: client_id
    - match:
        secretKey: client_secret
        remoteRef:
          remoteKey: vps-tailscale
          property: client_secret
