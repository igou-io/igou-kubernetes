---
apiVersion: "external-secrets.io/v1"
kind: "ExternalSecret"
metadata:
  name: "vps-cloudflare-source"
  namespace: "vps-secrets"
spec:
  refreshInterval: "5m"
  secretStoreRef:
    kind: "ClusterSecretStore"
    name: "onepassword-lab-external-api-keys"
  target:
    name: "vps-cloudflare-source"
    creationPolicy: "Owner"
    deletionPolicy: "Retain"
  data:
    -
      secretKey: "api-token"
      remoteRef:
        key: "cloudflare-dns-token-igou-io"
        property: "password"
        conversionStrategy: "Default"
        decodingStrategy: "None"
        metadataPolicy: "None"
        nullBytePolicy: "Ignore"
