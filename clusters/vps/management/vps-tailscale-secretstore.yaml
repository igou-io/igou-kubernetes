---
apiVersion: "external-secrets.io/v1"
kind: "SecretStore"
metadata:
  name: "vps-tailscale"
  namespace: "vps-secrets"
spec:
  provider:
    kubernetes:
      remoteNamespace: "tailscale"
      server:
        url: "https://vps-k3s-api.tailscale.svc.cluster.local:6443"
        caProvider:
          type: "Secret"
          name: "vps-connection"
          key: "ca.crt"
      auth:
        token:
          bearerToken:
            name: "vps-connection"
            key: "eso-token"
