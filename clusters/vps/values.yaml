---
default:
  app:
    enabled: true
    enableAutoSync: true
    autoSyncPrune: false
    project: cluster-config
    labels:
      app-source: cluster-vps
    destination:
      namespace: node-exporter
      server: https://vps-k3s-api.vps-secrets.svc.cluster.local:6443
    source:
      repoURL: https://github.com/igou-io/igou-kubernetes.git
      targetRevision: master
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
    syncPolicyRetry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

applications:
  bootstrap:
    annotations:
      argocd.argoproj.io/sync-wave: '0'
    destination:
      namespace: node-exporter
    source:
      path: clusters/vps/bootstrap

  external-secrets-operator:
    annotations:
      argocd.argoproj.io/sync-wave: '3'
    destination:
      namespace: external-secrets
    source:
      path: clusters/vps/external-secrets-operator

  external-secrets-config:
    annotations:
      argocd.argoproj.io/sync-wave: '4'
    destination:
      namespace: external-secrets
    source:
      path: clusters/vps/external-secrets-config

  cert-manager:
    annotations:
      argocd.argoproj.io/sync-wave: '5'
    destination:
      namespace: cert-manager
    source:
      path: clusters/vps/cert-manager

  nginx-gateway-fabric:
    annotations:
      argocd.argoproj.io/sync-wave: '6'
    destination:
      namespace: nginx-gateway
    source:
      path: clusters/vps/nginx-gateway-fabric

  tailscale-operator:
    annotations:
      argocd.argoproj.io/sync-wave: '8'
    destination:
      namespace: tailscale
    source:
      path: clusters/vps/tailscale-operator

  gateway-api:
    annotations:
      argocd.argoproj.io/sync-wave: '10'
    destination:
      namespace: nginx-gateway
    source:
      path: clusters/vps/gateway-api

  igou-io:
    enableAutoSync: false
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    destination:
      namespace: igou-io
    source:
      path: clusters/vps/igou-io

  gotify:
    enableAutoSync: false
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    destination:
      namespace: gotify
    source:
      path: clusters/vps/gotify
