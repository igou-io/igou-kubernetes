---
default:
  app:
    enabled: true
    enableAutoSync: true
    autoSyncPrune: false
    project: vps
    labels:
      app-source: cluster-vps
    destination:
      namespace: vps-system
      server: https://vps-k3s-api.vps-secrets.svc.cluster.local:6443
    source:
      repoURL: https://github.com/igou-io/igou-kubernetes.git
      targetRevision: master
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
    syncPolicyRetry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

applications:
  vps-bootstrap:
    annotations:
      argocd.argoproj.io/sync-wave: '0'
    destination:
      namespace: vps-system
    source:
      path: clusters/vps/bootstrap

  vps-external-secrets:
    annotations:
      argocd.argoproj.io/sync-wave: '3'
    destination:
      namespace: external-secrets
    source:
      path: clusters/vps/platform/external-secrets

  vps-secret-store:
    annotations:
      argocd.argoproj.io/sync-wave: '4'
    destination:
      namespace: external-secrets
    source:
      path: clusters/vps/platform/secret-store

  vps-cert-manager:
    annotations:
      argocd.argoproj.io/sync-wave: '5'
    destination:
      namespace: cert-manager
    source:
      path: clusters/vps/platform/cert-manager

  vps-nginx-gateway:
    annotations:
      argocd.argoproj.io/sync-wave: '6'
    destination:
      namespace: nginx-gateway
    source:
      path: clusters/vps/platform/nginx-gateway

  vps-tailscale-operator:
    annotations:
      argocd.argoproj.io/sync-wave: '8'
    destination:
      namespace: tailscale
    source:
      path: clusters/vps/platform/tailscale-operator

  vps-gateway:
    annotations:
      argocd.argoproj.io/sync-wave: '10'
    destination:
      namespace: nginx-gateway
    source:
      path: clusters/vps/gateway

  vps-igou-io:
    enableAutoSync: false
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    destination:
      namespace: igou-io
    source:
      path: clusters/vps/applications/igou-io

  vps-gotify:
    enableAutoSync: false
    annotations:
      argocd.argoproj.io/sync-wave: '20'
    destination:
      namespace: gotify
    source:
      path: clusters/vps/applications/gotify
