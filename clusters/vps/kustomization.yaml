---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vps-gitops

resources:
  - cluster-config-appproject.yaml

helmGlobals:
  chartHome: ../../.helm/charts

helmCharts:
  - name: argocd-app-of-app
    valuesFile: values.yaml
    namespace: vps-gitops

patches:
  - target:
      group: argoproj.io
      kind: Application
    patch: |-
      - op: add
        path: /metadata/namespace
        value: vps-gitops
