---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  name: "vps-gotify-secret-writer"
  namespace: "gotify"
rules:
  -
    apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"
