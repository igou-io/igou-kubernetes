---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vps-http-redirect
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: vps-public
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - igou.io
    - '*.igou.io'
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
