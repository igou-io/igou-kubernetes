---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vps-letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: vps-acme-account
    solvers:
      - selector:
          dnsZones:
            - igou.io
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
