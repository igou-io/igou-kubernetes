---
apiVersion: "cert-manager.io/v1"
kind: "Certificate"
metadata:
  name: "vps-igou-tls"
  namespace: "nginx-gateway"
  annotations:
    argocd.argoproj.io/sync-options: "Prune=false"
spec:
  secretName: "vps-igou-tls"
  dnsNames:
    - "igou.io"
    - "*.igou.io"
  issuerRef:
    kind: "ClusterIssuer"
    name: "vps-letsencrypt"
  privateKey:
    rotationPolicy: "Always"
    algorithm: "ECDSA"
    size: 256
