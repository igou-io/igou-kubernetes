---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vps-public
  namespace: nginx-gateway
spec:
  gatewayClassName: vps-nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              vps.igou.io/public-ingress: 'true'
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: vps-igou-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              vps.igou.io/public-ingress: 'true'
