---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-public-tls
  namespace: nginx-gateway
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-mirrors
  target:
    name: gateway-public-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        tls.crt: '{{ index (.bundle | mustFromJson) "tls.crt" }}'
        tls.key: '{{ index (.bundle | mustFromJson) "tls.key" }}'
  data:
    - secretKey: bundle
      remoteRef:
        key: vps-public-tls
        property: bundle
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
