---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: igou-io-www-redirect
  namespace: nginx-gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - www.igou.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: igou.io
            statusCode: 301
