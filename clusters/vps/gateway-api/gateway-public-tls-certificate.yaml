---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-public-tls
  namespace: nginx-gateway
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  secretName: gateway-public-tls
  dnsNames:
    - igou.io
    - '*.igou.io'
  issuerRef:
    kind: ClusterIssuer
    name: cluster-acme
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
