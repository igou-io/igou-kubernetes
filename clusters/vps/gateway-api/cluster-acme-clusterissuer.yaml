---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-acme
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: acme-private-key
    solvers:
      - selector:
          dnsZones:
            - igou.io
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: dns-token
              key: api-token
