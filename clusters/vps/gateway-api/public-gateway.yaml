---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              vps.igou.io/public-ingress: 'true'
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: gateway-public-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              vps.igou.io/public-ingress: 'true'
    - name: tcp-27010
      protocol: TCP
