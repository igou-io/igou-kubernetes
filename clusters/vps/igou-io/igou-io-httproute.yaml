---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: igou-io
  namespace: igou-io
spec:
  parentRefs:
    - name: public
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - igou.io
  rules:
    - backendRefs:
        - name: igou-io
          port: 80
