---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gotify
  namespace: gotify
spec:
  parentRefs:
    - name: public
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - gotify.igou.io
  rules:
    - backendRefs:
        - name: gotify
          port: 80
