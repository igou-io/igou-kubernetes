---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "igou-io"
  namespace: "igou-io"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: "igou-io"
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "igou-io"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        -
          name: "igou-io"
          image: "quay.io/igou/igou.io:vps@sha256:6c559e265c2c6c8890a0d1639b668252add5a6aa64de73d0cb12d0a77a5dff69"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
          volumeMounts:
            -
              name: "tmp"
              mountPath: "/tmp"
          ports:
            -
              name: "http"
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          readinessProbe:
            httpGet:
              path: "/"
              port: "http"
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/"
              port: "http"
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        -
          name: "tmp"
          emptyDir:
            sizeLimit: "32Mi"
