---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify-admin
  namespace: gotify
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vps-secrets
  target:
    name: gotify-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: vps-gotify
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
