---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vps-management
  namespace: vps-gitops
spec:
  description: Dedicated VPS vps-management resources
  sourceRepos:
    - https://github.com/igou-io/igou-kubernetes.git
  destinations:
    - namespace: vps-secrets
      server: https://kubernetes.default.svc
    - namespace: vps-gitops
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
