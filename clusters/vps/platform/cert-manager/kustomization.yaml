---
apiVersion: "kustomize.config.k8s.io/v1beta1"
kind: "Kustomization"
resources: []
namespace: "cert-manager"
helmCharts:
  -
    name: "cert-manager"
    releaseName: "cert-manager"
    namespace: "cert-manager"
    version: "v1.21.2"
    repo: "https://charts.jetstack.io"
    includeCRDs: true
    valuesInline:
      crds:
        enabled: true
        keep: true
      global:
        leaderElection:
          namespace: "cert-manager"
      prometheus:
        enabled: false
      dns01RecursiveNameservers: "1.1.1.1:53,9.9.9.9:53"
      dns01RecursiveNameserversOnly: true
      resources:
        requests:
          cpu: "10m"
          memory: "64Mi"
        limits:
          memory: "256Mi"
      webhook:
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            memory: "128Mi"
      cainjector:
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            memory: "256Mi"
