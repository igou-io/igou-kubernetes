---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: node-exporter

helmCharts:
  - name: prometheus-node-exporter
    releaseName: node-exporter
    namespace: node-exporter
    version: 4.60.0
    repo: https://prometheus-community.github.io/helm-charts
    valuesInline:
      nameOverride: node-exporter
      image:
        tag: v1.11.1
        digest: sha256:0f422f62c15f154af8d8572b23d623aebfb10cec73a5c654d18f911f3f9df241
      # Preserve the existing tailnet scrape endpoint; vps-guard blocks public 9100.
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      hostRootFsMount:
        enabled: true
        mountPropagation: HostToContainer
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+|var/lib/kubelet/.+|var/lib/rancher/k3s/.+)($|/)
