---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-mirrors
spec:
  conditions:
    - namespaces:
        - cert-manager
        - tailscale
        - gotify
  provider:
    kubernetes:
      remoteNamespace: external-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: mirror-reader
          namespace: external-secrets
