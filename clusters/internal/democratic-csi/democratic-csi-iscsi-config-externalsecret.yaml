# Templated from the `truenas` item in the lab_rk8s vault; requires the
# truenas_csi_api_key_rk8s field (user-linked key of the dedicated
# TrueNAS `csi` account — same account model as igou-openshift).
# nameSuffix -rk8s keeps iSCSI target names disjoint from ocp's (-ocp).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-iscsi-config
  namespace: democratic-csi
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    name: democratic-csi-iscsi-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        driver-config-file.yaml: |-
          driver: freenas-api-iscsi
          instance_id:
          node:
            mount:
              mount_flags: ""
              checkFilesystem:
                xfs:
                  enabled: true
                  customOptions: []
                ext4:
                  enabled: true
                  customOptions: []
                  customFilesystemOptions: []
                btrfs:
                  enabled: true
                  customOptions: []
                  customFilesystemOptions: []
          httpConnection:
            protocol: https
            host: {{ .truenas_host }}
            port: 443
            apiKey: {{ .truenas_csi_api_key_rk8s }}
            allowInsecure: false
            apiVersion: 2
          zfs:
            datasetParentName: ssd/rk8s/vols
            detachedSnapshotsDatasetParentName: cold/rk8sbak/ssd
            zvolCompression:
            zvolDedup:
            zvolEnableReservation: false
            zvolBlocksize:
          iscsi:
            targetPortal: "{{ .truenas_host }}:3260"
            targetPortals: []
            interface:
            namePrefix: csi-
            nameSuffix: "-rk8s"
            targetGroups:
              - targetGroupPortalGroup: 1
                targetGroupInitiatorGroup: 5
                targetGroupAuthType: None
                targetGroupAuthGroup:
            extentInsecureTpc: true
            extentXenCompat: false
            extentDisablePhysicalBlocksize: true
            extentBlocksize: 512
            extentRpm: "SSD"
            extentAvailThreshold: 0
  dataFrom:
    - extract:
        key: truenas
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
