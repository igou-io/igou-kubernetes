applications:

  app-of-apps:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '0'
    destination:
      namespace: argocd
    source:
      path: clusters/internal

  democratic-csi:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '7'
    destination:
      namespace: democratic-csi
    source:
      path: clusters/internal/democratic-csi

  cloudnative-pg:
    # Staged adoption: the workloads already run live (kubectl-applied
    # during arm64 verification). No auto-sync — each app is synced
    # manually, one at a time, and auto-sync gets enabled in a follow-up
    # once verified healthy under ArgoCD management.
    enableAutoSync: false
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '8'
    destination:
      namespace: cnpg-system
    source:
      path: components/cloudnative-pg

  kube-prometheus-stack:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    destination:
      namespace: monitoring
    source:
      path: components/kube-prometheus-stack

  loki:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '11'
    destination:
      namespace: loki
    source:
      path: components/loki

  gateway:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      # After cert-manager/metallb/NGF (wave 5-6) and kube-prometheus-stack
      # (wave 10, which owns the monitoring namespace + prometheus Service
      # this app's HTTPRoute and namespace label depend on). ArgoCD retries
      # cover any residual ordering gaps.
      argocd.argoproj.io/sync-wave: '15'
    destination:
      namespace: nginx-gateway
    source:
      path: components/gateway

  tailscale-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '12'
    destination:
      namespace: tailscale
    source:
      path: components/tailscale-operator

  service-accounts:
    # Staged adoption: the workloads already run live (kubectl-applied
    # during arm64 verification). No auto-sync — each app is synced
    # manually, one at a time, and auto-sync gets enabled in a follow-up
    # once verified healthy under ArgoCD management.
    enableAutoSync: false
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '13'
    destination:
      namespace: service-accounts
    source:
      path: components/service-accounts

  molecule:
    # Staged adoption: the workloads already run live (kubectl-applied
    # during arm64 verification). No auto-sync — each app is synced
    # manually, one at a time, and auto-sync gets enabled in a follow-up
    # once verified healthy under ArgoCD management.
    enableAutoSync: false
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      # wave 12 (before service-accounts wave 13) so the molecule namespace
      # exists when the ansible-molecule RoleBinding is applied into it.
      argocd.argoproj.io/sync-wave: '12'
    destination:
      namespace: molecule
    source:
      path: components/molecule

  headlamp:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      # After gateway (wave 15): the HTTPRoute here attaches to the
      # cluster-wildcard Gateway. ArgoCD retries cover residual ordering
      # gaps.
      argocd.argoproj.io/sync-wave: '16'
    destination:
      namespace: headlamp
    source:
      path: components/headlamp

  whoami:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      # After gateway (wave 15): the HTTPRoute here attaches to the iot
      # Gateway. ArgoCD retries cover residual ordering gaps.
      argocd.argoproj.io/sync-wave: '16'
    destination:
