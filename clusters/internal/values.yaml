applications:

  app-of-apps:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '0'
    destination:
      namespace: argocd
    source:
      path: clusters/internal

  # CSI snapshot CRDs + controller (k3s bundles neither); must precede
  # democratic-csi's volumeSnapshotClasses.
  snapshot-controller:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '6'
    destination:
      namespace: snapshot-controller
    source:
      path: components/snapshot-controller

  democratic-csi:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '7'
    destination:
      namespace: democratic-csi
    source:
      path: clusters/internal/democratic-csi

  cloudnative-pg:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '8'
    destination:
      namespace: cnpg-system
    source:
      path: components/cloudnative-pg

  kube-prometheus-stack:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '10'
    destination:
      namespace: monitoring
    source:
      path: components/kube-prometheus-stack

  # Ship-don't-store log collection to the ocp log-gateway
  # (igou-openshift#382 phase 5). The former filesystem Loki
  # (components/loki) is retired — nothing ever shipped to it and rk8s
  # logs now land in the central LokiStack.
  alloy:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '11'
    destination:
      namespace: alloy
    source:
      path: components/alloy

  gateway:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      # After cert-manager/metallb/NGF (wave 5-6) and kube-prometheus-stack
      # (wave 10, which owns the monitoring namespace + prometheus Service
      # this app's HTTPRoute and namespace label depend on). ArgoCD retries
      # cover any residual ordering gaps.
      argocd.argoproj.io/sync-wave: '15'
    destination:
      namespace: nginx-gateway
    source:
      path: components/gateway

  tailscale-operator:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '12'
    destination:
      namespace: tailscale
    source:
      path: components/tailscale-operator

  service-accounts:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '13'
    destination:
      namespace: service-accounts
    source:
      path: components/service-accounts

  molecule:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      # wave 12 (before service-accounts wave 13) so the molecule namespace
      # exists when the ansible-molecule RoleBinding is applied into it.
      argocd.argoproj.io/sync-wave: '12'
    destination:
      namespace: molecule
    source:
      path: components/molecule

  headlamp:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      # After gateway (wave 15): the HTTPRoute here attaches to the
      # cluster-wildcard Gateway. ArgoCD retries cover residual ordering
      # gaps.
      argocd.argoproj.io/sync-wave: '16'
    destination:
      namespace: headlamp
    source:
      path: components/headlamp

  whoami:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      # After gateway (wave 15): the HTTPRoute here attaches to the iot
      # Gateway. ArgoCD retries cover residual ordering gaps.
      argocd.argoproj.io/sync-wave: '16'
    destination:
      namespace: whoami
    source:
      path: components/whoami

  kubevirt:
    annotations:
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-wave: '50'
    # The pinned CDI v1.65.0 install manifest still ships the deprecated
    # v1alpha1 API in the cdis CRD; the running cdi-operator owns the CRD at
    # runtime and keeps it v1beta1-only, so versions/conversion diff forever.
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        name: cdis.cdi.kubevirt.io
        jsonPointers:
          - /spec/versions
          - /spec/conversion
    destination:
      namespace: kubevirt
    source:
      path: components/kubevirt
