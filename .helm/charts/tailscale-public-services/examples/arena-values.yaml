---
# Matches the illustrative OpenShift arena-values.yaml; not registered in Argo.
services:
  - name: arena
    tailnetFQDN: ocp-public-arena.weasel-alioth.ts.net
    ports:
      - name: web
        port: 8080
        protocol: HTTP
        listener: https
        hostnames:
          - arena.igou.io
      - name: arena-tcp
        port: 27015
        protocol: TCP
        listener: arena-tcp
      - name: arena-udp
        port: 27016
        protocol: UDP
        listener: arena-udp
