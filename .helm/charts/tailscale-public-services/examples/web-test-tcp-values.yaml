---
# Renders a native Gateway API TCPRoute to the web server on backend TCP 8080.
# Equivalent plain manifests: examples/native-tcp/.
services:
  - name: web-test
    tailnetFQDN: ocp-public-web-test.weasel-alioth.ts.net
    ports:
      - name: tcp
        port: 8080
        protocol: TCP
        listener: tcp-27010
