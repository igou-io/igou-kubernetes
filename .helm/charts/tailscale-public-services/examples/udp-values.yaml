---
# Matches OpenShift's udp-values.yaml and test-workloads/public-services-udp.
# The workload and forwarding remain staged.
services:
  - name: udp-echo
    tailnetFQDN: ocp-public-udp-echo.weasel-alioth.ts.net
    ports:
      - name: udp
        port: 9000
        protocol: UDP
        listener: udp-27018
