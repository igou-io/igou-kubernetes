---
apiVersion: v1
kind: Service
metadata:
  name: ocp-web-test-bridge
  namespace: tailscale
spec:
  type: ClusterIP
  selector:
    tailscale.com/managed: 'true'
    tailscale.com/parent-resource-type: svc
    tailscale.com/parent-resource: ocp-web-test
    tailscale.com/parent-resource-ns: public-services
  ports:
    - name: tcp
      port: 8080
      targetPort: 8080
      protocol: TCP
