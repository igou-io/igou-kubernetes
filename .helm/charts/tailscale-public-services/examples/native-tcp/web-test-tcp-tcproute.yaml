---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: web-test-tcp
  namespace: public-services
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: nginx-gateway
      sectionName: tcp-27010
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: ocp-web-test-bridge
          namespace: tailscale
          port: 8080
          weight: 1
