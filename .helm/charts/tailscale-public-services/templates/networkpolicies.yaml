{{- range $service := .Values.services }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocp-{{ $service.name }}
  namespace: {{ $.Values.proxyNamespace | quote }}
spec:
  podSelector:
    matchLabels:
      tailscale.com/managed: 'true'
      tailscale.com/parent-resource-type: svc
      tailscale.com/parent-resource: ocp-{{ $service.name }}
      tailscale.com/parent-resource-ns: {{ $.Values.namespace | quote }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.gateway.namespace | quote }}
      ports:
        {{- range $port := $service.ports }}
        - port: {{ $port.port }}
          protocol: {{ eq $port.protocol "UDP" | ternary "UDP" "TCP" }}
        {{- end }}
{{- end }}
