# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
---
# Materializes one of the three cluster-init-bundle secrets minted by Central
# (roxctl central init-bundles generate) and stored in 1Password — see
# README.md for the bootstrap procedure. Sits in SecretSyncedError until the
# 1P item exists; the secured-cluster pods stay degraded until then.
#
# secretStoreRef points at a ClusterSecretStore that is NOT wired up on rk8s
# yet (the external-secrets component ships no ClusterSecretStore — see the
# repo README). Name mirrors the OCP source (onepassword-lab-openshift).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sensor-tls
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,SkipHealthCheck=true
    argocd.argoproj.io/sync-wave: '-2'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: sensor-tls
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: stackrox-sensor-tls
        metadataPolicy: None
        nullBytePolicy: Ignore
