# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
clusterName: rk8s
# centralEndpoint defaults to central.<namespace>.svc:443 (same namespace).

# k3s, not OpenShift — no Route/SCC/monitoring autosense.
env:
  openshift: false

# PORT NOTE: chart images default to registry.redhat.io/advanced-cluster-
# security, which needs a pull secret this cluster has not wired yet. allowNone
# lets the manifests render; add a pull secret or repoint image.registry to
# quay.io/stackrox-io before this actually pulls. See gaps.
imagePullSecrets:
  allowNone: true

# PSPs are gone in k8s 1.25+ (k3s); do not emit them.
system:
  enablePodSecurityPolicies: false

# OCP integrated platform monitoring is absent on k3s.
monitoring:
  openshift:
    enabled: false

# The per-service TLS (sensor/collector/admission-control) is delivered by the
# ExternalSecrets in this component, not generated by the chart.
createSecrets: false

