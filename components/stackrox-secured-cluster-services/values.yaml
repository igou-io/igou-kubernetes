sensor:
  # PORT NOTE: OCP pinned Sensor to hostname truenas-w1 (dropped here — that
  # hostname does not exist on rk8s). Requests from OCP measurement (#381).
  resources:
    requests:
      cpu: 100m
      memory: 2560Mi
    limits:
      memory: 4Gi

admissionControl:
  # Observe-only, exactly as OCP (enforcement: Disabled). The webhook is
  # deployed and evaluates admission (listenOn*), but takes no action.
  # `enforce` is the single 4.9+ knob (the old enforceOnCreates/enforceOnUpdates
  # are deprecated + ignored); flipping it to true is the one switch that makes
  # the SecurityPolicy enforcementActions block. failurePolicy Ignore keeps it
  # fail-open (no API-availability risk).
  enforce: false
  listenOnCreates: true
  listenOnUpdates: true
  listenOnEvents: true
  failurePolicy: Ignore
  dynamic:
    disableBypass: false
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 160Mi
    limits:
      memory: 500Mi

collector:
  collectionMethod: CORE_BPF
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      memory: 1Gi
  # Compliance runs in the collector DaemonSet pod (OCP perNode.compliance).
  complianceResources:
    requests:
      cpu: 50m
      memory: 100Mi

# Local/delegated image scanning off (OCP scanner/scannerV4 Disabled).
scanner:
  disable: true
scannerV4:
  disable: true
