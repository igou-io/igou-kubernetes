---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stackrox
resources:
  - stackrox-namespace.yaml
  - rhacs-registry-externalsecret.yaml
  - cluster-registration-secret-externalsecret.yaml
  - rk8s-securedcluster.yaml
helmCharts:
  - name: rhacs-operator
    includeCRDs: true
    releaseName: rhacs-operator
    namespace: stackrox
    version: 4.11.6
    repo: https://mirror.openshift.com/pub/rhacs/charts/
    valuesFile: values.yaml
