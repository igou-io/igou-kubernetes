# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
---
# One of the three cluster-init-bundle secrets (see sensor-tls + README).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admission-control-tls
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,SkipHealthCheck=true
    argocd.argoproj.io/sync-wave: '-2'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-openshift
  target:
    name: admission-control-tls
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: stackrox-admission-control-tls
        metadataPolicy: None
        nullBytePolicy: Ignore
