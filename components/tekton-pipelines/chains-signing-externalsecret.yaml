# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
---
# Tekton Chains signing key material. Same 1Password item as OCP
# (tekton-chains-signing); creationPolicy Merge so ESO only adds the signing
# keys and leaves the rest of the chains-managed signing-secrets Secret alone.
# The store name is swapped to the rk8s-native onepassword-lab-rk8s store
# (the OCP onepassword-lab-openshift store does not exist here). See the
# component gaps: no rk8s ClusterSecretStore is wired up until bootstrap, and
# the tekton-chains-signing item lives in the lab_openshift vault, not the
# lab_rk8s vault this store is scoped to.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signing-secrets
  namespace: tekton-pipelines
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "12"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    name: signing-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tekton-chains-signing
        metadataPolicy: None
        nullBytePolicy: Ignore
