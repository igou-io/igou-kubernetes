---
# Exposes whoami over the iot tier Gateway at whoami.iot.igou.systems.
# The matching rb5009 A record (→ 10.10.151.129) lives in igou-inventory —
# tier domains have no DNS wildcard by design.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  # group/kind/weight below are API-server defaults, stated explicitly so
  # ArgoCD's server-side-apply diff doesn't report the route as forever
  # OutOfSync (same wart as the Gateway certificateRefs).
  parentRefs:
    - name: iot
      namespace: nginx-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - whoami.iot.igou.systems
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
          group: ""
          kind: Service
          weight: 1
