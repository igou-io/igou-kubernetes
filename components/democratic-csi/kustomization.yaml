apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: democratic-csi
resources:
  - democratic-csi-namespace.yaml
# Driver config secrets (democratic-csi-{nfs,iscsi}-config) are NOT in
# git — they are rendered by the ExternalSecrets in
# clusters/internal/democratic-csi/ (1Password via ESO), mirroring
# igou-openshift's components/ vs clusters/ split. Both drivers are the
# pure-API freenas-api-* variants authenticating as the dedicated
# TrueNAS `csi` user — no sshConnection anywhere.
# Snapshot CRDs + controller come from components/snapshot-controller
# (sync-wave 6). Local classes are same-pool ZFS snapshots; -detached
# classes are full send/receive copies onto the cold pool (see the
# detachedSnapshotsDatasetParentName in the driver configs).
# detachedVolumesFromSnapshots on the StorageClasses is required to
# restore from a -detached snapshot (cross-pool zfs clone is impossible).
helmCharts:
# ---- NFS ----
- name: democratic-csi
  namespace: democratic-csi
  includeCRDs: false
  releaseName: democratic-csi-nfs
  version: 0.15.1
  repo: https://democratic-csi.github.io/charts/
  valuesInline:
    csiDriver:
      name: "org.democratic-csi.nfs"
    controller:
      driver:
        enabled: true
        image:
          registry: "ghcr.io/democratic-csi/democratic-csi"
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: "latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced"
    node:
      driver:
        enabled: true
        localtimeHostPath: null
        image:
          registry: "ghcr.io/democratic-csi/democratic-csi"
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: "latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced"
    storageClasses:
      - name: freenas-nfs-ssd-csi
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
          detachedVolumesFromSnapshots: true
        mountOptions:
          - noatime
          - nfsvers=4
        secrets:
          provisioner-secret:
          controller-publish-secret:
          node-stage-secret:
          node-publish-secret:
          controller-expand-secret:
    volumeSnapshotClasses:
      - name: freenas-nfs-ssd-csi
        deletionPolicy: Delete
        # Per-driver default so implicit class selection (classless
        # VolumeSnapshots, future KubeVirt/CDI) gets the local class.
        annotations:
          snapshot.storage.kubernetes.io/is-default-class: "true"
        parameters:
          detachedSnapshots: "false"
      - name: freenas-nfs-ssd-csi-detached
        deletionPolicy: Delete
        parameters:
          detachedSnapshots: "true"
    driver:
      existingConfigSecret: "democratic-csi-nfs-config"
      config:
        driver: freenas-api-nfs
# ---- iSCSI ----
- name: democratic-csi
  namespace: democratic-csi
  includeCRDs: false
  releaseName: democratic-csi-iscsi
  version: 0.15.1
  repo: https://democratic-csi.github.io/charts/
  valuesInline:
    csiDriver:
      name: "org.democratic-csi.iscsi"
    controller:
      driver:
        enabled: true
        image:
          registry: "ghcr.io/democratic-csi/democratic-csi"
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: "latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced"
      hostNetwork: true
    node:
      driver:
        enabled: true
        localtimeHostPath: null
        image:
          registry: "ghcr.io/democratic-csi/democratic-csi"
          # renovate: datasource=docker depName=ghcr.io/democratic-csi/democratic-csi
          tag: "latest@sha256:944d0e65077efbd9c1fdf23997eec8fac4b4bfb7c3de400f63e33a0a849c5ced"
    storageClasses:
      - name: freenas-iscsi-ssd-csi
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: ext4
          detachedVolumesFromSnapshots: true
        mountOptions: []
        secrets:
          provisioner-secret:
          controller-publish-secret:
          node-stage-secret:
          node-publish-secret:
          controller-expand-secret:
    volumeSnapshotClasses:
      - name: freenas-iscsi-ssd-csi
        deletionPolicy: Delete
        # Per-driver default so implicit class selection (classless
        # VolumeSnapshots, future KubeVirt/CDI) gets the local class.
        annotations:
          snapshot.storage.kubernetes.io/is-default-class: "true"
        parameters:
          detachedSnapshots: "false"
      - name: freenas-iscsi-ssd-csi-detached
        deletionPolicy: Delete
        parameters:
          detachedSnapshots: "true"
    driver:
      existingConfigSecret: "democratic-csi-iscsi-config"
      config:
        driver: freenas-api-iscsi
