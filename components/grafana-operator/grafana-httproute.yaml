---
# Exposes Grafana over the shared trusted-lan Gateway
# (components/gateway) at grafana.rk8s.igou.systems. Replaces the OCP
# reencrypt Route. TLS terminates at the Gateway (wildcard-rk8s cert); the
# backend is the operator-managed `grafana-service` on :3000.
#
# WARNING: unlike the OCP source there is NO auth proxy in front of this —
# anything on the trusted LAN reaching the VIP hits Grafana's own login
# form directly. A matching EXPLICIT A record (grafana.rk8s -> 10.10.150.129)
# must exist in igou-inventory (no *.rk8s wildcard). See gaps.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  # group/kind/weight below are API-server defaults, stated explicitly so
  # ArgoCD's server-side-apply diff doesn't report the route as forever
  # OutOfSync (same wart as the gateway component's routes).
  parentRefs:
    - name: trusted-lan
      namespace: nginx-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - grafana.rk8s.igou.systems
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
          group: ""
          kind: Service
          weight: 1
