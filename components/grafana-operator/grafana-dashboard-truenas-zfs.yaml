# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
---
# TrueNAS ZFS & storage-health dashboard (pools, datasets, ARC, middleware).
# Vendored under dashboards/ + configMapGenerator so the datasource uid refs
# can be mapped to prometheus below.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grafana-dashboard-truenas-zfs
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 24h
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  configMapRef:
    name: grafana-dashboard-truenas-zfs-json
    key: truenas-zfs.json
