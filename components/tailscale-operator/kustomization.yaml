apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
resources:
  - tailscale-namespace.yaml
  - operator-oauth-externalsecret.yaml
helmCharts:
- name: tailscale-operator
  includeCRDs: true
  releaseName: tailscale
  namespace: tailscale
  version: 1.102.2
  repo: https://pkgs.tailscale.com/helmcharts
  valuesInline:
    # OAuth credentials come from the operator-oauth ExternalSecret, not
    # chart values.
    oauth: {}

    installCRDs: true

    # Tailnet tag scheme: the operator device is tag:rk8s-operator (set on
    # the OAuth client too), and proxies it creates get tag:rk8s. ACL must
    # define tagOwners {"tag:rk8s-operator": [], "tag:rk8s": ["tag:rk8s-operator"]}.
    operatorConfig:
      defaultTags:
        - "tag:rk8s-operator"
      hostname: "rk8s-operator"
      logging: "info"

    proxyConfig:
      defaultTags: "tag:rk8s"
      firewallMode: auto

    apiServerProxyConfig:
      mode: "false"
