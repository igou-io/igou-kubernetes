# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alloy-logs
resources:
  - alloy-logs-namespace.yaml
helmCharts:
# Cluster log collector, the vanilla-k8s port of igou-openshift's
# ClusterLogForwarder `collector` (a Vector DaemonSet). Uses the
# project-maintained grafana/alloy chart as a DaemonSet, tailing pod logs
# (application + infrastructure combined — vanilla k8s has no OpenShift
# tenant split) and the host systemd journal, writing to the SimpleScalable
# loki-gateway. Audit collection is NOT ported (no kube-apiserver audit
# webhook/policy on k3s — see gaps).
- name: alloy
  includeCRDs: true
  releaseName: alloy
  namespace: alloy-logs
  version: 1.11.1
  repo: https://grafana.github.io/helm-charts
  valuesInline:
    controller:
      # One collector per node (mirrors the CLF Vector DaemonSet).
      type: daemonset
      # Volatile journal path; the persistent one comes in via mounts.varlog
      # (/var/log/journal). rk8s hosts write to both depending on
      # Storage=auto — mount both so a boot's worth of journal is never
      # missed (central-logging both-journal-paths note).
      volumes:
        extra:
          - name: runlogjournal
            hostPath:
              path: /run/log/journal
    alloy:
      # Root: /var/log/pods/*.log and the host journal are root-owned; the
      # chart's default non-root context can read neither.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        readOnlyRootFilesystem: true
      mounts:
        # /var/log gives /var/log/pods (container logs) and /var/log/journal
        # (persistent journal).
        varlog: true
        extra:
          - name: runlogjournal
            mountPath: /run/log/journal
            readOnly: true
      configMap:
        content: |-
          // --- Pod logs (application + infrastructure) ---------------------
          // Discover every pod on this node and tail its container log files
          // under /var/log/pods. Labels mirror what downstream LogQL expects
          // (namespace/pod/container/app), the vanilla analogue of the CLF
          // application+infrastructure inputs.
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME_NODE")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            // Canonical pod-log path glob: /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              action        = "replace"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          loki.process "pods" {
            // k3s/containerd write the CRI log format; parse it back to the
            // bare message + stream/time.
            stage.cri {}
            // Ported from the CLF drop-csi-exec-noise filter: kubelet's
            // ~1/min NodeGetVolumeStats poll drives bare "executing ...
            // command:" and per-request/response dumps. Errors/warnings
            // don't match these anchors and still flow.
            stage.match {
              selector = "{namespace=\"democratic-csi\"}"
              stage.drop {
                expression = "^(executing (mount|filesystem|ssh) command:|\\d{4}/\\d{2}/\\d{2} \\d{2}:\\d{2}:\\d{2} (request|response))"
              }
            }
            forward_to = [loki.write.central.receiver]
          }

          // --- Host systemd journal ----------------------------------------
          // Same shape as the ansible-managed host alloy (roles/alloy):
          // job=systemd-journal, host + unit relabelled off journal fields.
          loki.source.journal "host" {
            max_age       = "12h"
            relabel_rules = loki.relabel.journal.rules
            labels        = { job = "systemd-journal" }
            forward_to    = [loki.write.central.receiver]
          }

          loki.relabel "journal" {
            forward_to = []
            rule {
              source_labels = ["__journal__hostname"]
              target_label  = "host"
            }
            rule {
              source_labels = ["__journal__systemd_unit"]
              target_label  = "unit"
            }
          }

          // --- Write to the central SimpleScalable Loki --------------------
          // cluster=rk8s stamps every stream (matches the prometheus
          // externalLabels convention) so a future multi-cluster store can
          // attribute it. Unauthenticated: auth_enabled is off on this Loki
          // and the gateway is a ClusterIP (no external exposure).
          loki.write "central" {
            endpoint {
              url = "http://loki-gateway.loki-scalable.svc.cluster.local:80/loki/api/v1/push"
            }
            external_labels = { cluster = "rk8s" }
          }
      # Scope the pod discovery to this node via the downward-API node name
      # (HOSTNAME_NODE), so each DaemonSet pod only tails its own node's logs.
      extraEnv:
        - name: HOSTNAME_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
    # ServiceMonitor for alloy's own telemetry, picked up by the cluster-wide
    # kube-prometheus-stack (serviceMonitorSelectorNilUsesHelmValues: false).
    serviceMonitor:
      enabled: true
