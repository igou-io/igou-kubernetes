---
# Exposes the Alertmanager UI/API over the cluster-wildcard Gateway at
# alertmanager.rk8s.igou.systems (resolved by rb5009's *.rk8s wildcard —
# no per-hostname DNS needed). Alertmanager has NO auth (silences can be
# created/deleted): acceptable only because the wildcard VIP is reachable
# solely from VLAN9 and admin (rb5009 forward chain).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  # group/kind/weight below are API-server defaults, stated explicitly so
  # ArgoCD's server-side-apply diff doesn't report the route as forever
  # OutOfSync (same wart as the Gateway certificateRefs).
  parentRefs:
    - name: cluster-wildcard
      namespace: nginx-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - alertmanager.rk8s.igou.systems
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
          group: ""
          kind: Service
          weight: 1
