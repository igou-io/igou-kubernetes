apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - monitoring-namespace.yaml
  - prometheus-httproute.yaml
  - alertmanager-httproute.yaml
helmCharts:
- name: kube-prometheus-stack
  includeCRDs: true
  releaseName: kube-prometheus-stack
  namespace: monitoring
  version: 87.16.1
  repo: https://prometheus-community.github.io/helm-charts
  valuesInline:
    fullnameOverride: kube-prometheus-stack

    prometheus:
      prometheusSpec:
        # Stamped onto every series this Prometheus exposes, including over
        # /federate. Lets the OCP UWM federation scrape attribute pulled-in
        # series to this source cluster (cross-cluster federation, see the
        # gateway component + igou-openshift UWM additionalScrapeConfig).
        externalLabels:
          cluster: rk8s
        # Pick up all ServiceMonitors/PodMonitors/Rules cluster-wide, not
        # just the ones with the chart's release label.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        retention: 30d
        # Durable TSDB on TrueNAS (democratic-csi iSCSI); without this the
        # 30d retention above only ever holds until the pod restarts.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: freenas-iscsi-ssd-csi
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi

    alertmanager:
      alertmanagerSpec:
        # Persist silences + notification dedup state across restarts.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: freenas-iscsi-ssd-csi
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi

    # Grafana ships disabled here; a dedicated Grafana operator will own it.
    grafana:
      enabled: false

    # k3s runs these control-plane components in-process; there are no
    # separate pods/endpoints to scrape.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
