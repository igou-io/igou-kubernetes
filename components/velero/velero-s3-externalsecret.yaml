# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
---
# S3 credentials for Velero's BackupStorageLocation (rustfs COLD instance).
# Materialised as Secret `velero-s3-credentials` (key `cloud`) in the velero
# namespace, in the AWS shared-credentials INI shape Velero's aws plugin
# reads (credentials.existingSecret in kustomization.yaml).
#
# Modeled on igou-openshift's rustfs S3 ExternalSecrets
# (clusters/ocp/netobserv + openshift-logging): same `onepassword-lab-s3`
# ClusterSecretStore, same COLD RustFS endpoint, same username/password
# item shape.
#
# PREREQUISITE: 1Password item `velero-user-rustfs-cold` in the `lab_s3`
# vault (fields username/password), matching a `velero` IAM user on the
# COLD RustFS instance — igou-inventory host_vars/rustfs-cold.yml, applied
# via AAP rustfs_state_converge. Item does not exist yet (see gaps).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
  namespace: velero
  annotations:
    # BSL/Secret may reconcile before the store resolves; don't fail the
    # dry-run on a not-yet-present backing secret.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-s3
  target:
    name: velero-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace # API-defaulted; declared so ArgoCD (SSA) stays Synced
      data:
        # Velero's aws plugin reads an AWS shared-credentials INI file from
        # the secret key named by credentials.name (default `cloud`).
        cloud: |
          [default]
          aws_access_key_id={{ .username }}
          aws_secret_access_key={{ .password }}
  data:
    - secretKey: username
      remoteRef:
        key: velero-user-rustfs-cold
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: velero-user-rustfs-cold
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
