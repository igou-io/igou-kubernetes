# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
---
apiVersion: v1
kind: Namespace
metadata:
  name: capm3-system
  labels:
    # capm3-controller-manager and ipam-controller-manager. Same rationale as
    # capi-system: nonroot containers, no privileged/hostPath, PSA baseline
    # pinned so a restricted default can't block rollout.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
