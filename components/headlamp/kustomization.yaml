apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headlamp
resources:
  - headlamp-namespace.yaml
  - headlamp-httproute.yaml
  - headlamp-admin-serviceaccount.yaml
  - headlamp-admin-clusterrolebinding.yaml
helmCharts:
- name: headlamp
  includeCRDs: true
  releaseName: headlamp
  namespace: headlamp
  version: 0.46.0
  repo: https://kubernetes-sigs.github.io/headlamp/
  valuesInline:
    # Token login (Headlamp's default): sessions authenticate with a
    # short-lived token minted via `kubectl create token headlamp-admin -n
    # headlamp` (headlamp-admin-*.yaml). The pod's own `headlamp`
    # ServiceAccount has no RBAC, so a compromised UI pod does not hold
    # cluster-admin. No OIDC provider on this cluster, and
    # unsafeUseServiceAccountToken stays off so the trusted-lan exposure
    # still requires a token.
    config:
      oidc:
        # Don't render the (empty) OIDC secret the chart creates by default.
        secret:
          create: false

    serviceAccount:
      create: true
    clusterRoleBinding:
      create: false

    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    replicaCount: 1

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
