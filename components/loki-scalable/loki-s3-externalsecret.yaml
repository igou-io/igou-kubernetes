# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
---
# S3 object-storage credentials for the SimpleScalable Loki, ported from the
# ocp LokiStack's logging-loki-s3 secret (igou-openshift
# clusters/ocp/openshift-logging/logging-loki-s3-externalsecret.yaml).
# Same 1Password item `loki-user-rustfs-cold` (vault lab_s3, fields
# username/password) = the `loki` IAM user on the COLD RustFS instance
# (igou-inventory host_vars/rustfs-cold.yml), same `loki` bucket.
#
# Shape differs from the ocp secret on purpose: the LokiStack operator reads
# a fixed key set (bucketnames/endpoint/access_key_id/...); the grafana/loki
# chart instead expands ${ENV} in its rendered config (-config.expand-env),
# so this only needs to project the two credential fields as env vars. The
# endpoint/region/bucket are non-secret and live in the chart valuesInline.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: loki-scalable
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-s3
  target:
    name: loki-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace # API-defaulted; declared so ArgoCD (SSA) stays Synced
      data:
        S3_ACCESS_KEY_ID: "{{ .username }}"
        S3_SECRET_ACCESS_KEY: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: loki-user-rustfs-cold
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: loki-user-rustfs-cold
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
