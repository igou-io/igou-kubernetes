# UNTESTED: ported from igou-openshift (PR #914) and never applied to a live
# cluster - validate end-to-end before adopting on rk8s.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loki-scalable
resources:
  - loki-scalable-namespace.yaml
  - loki-s3-externalsecret.yaml
helmCharts:
# Production-parity Loki: the project-maintained grafana/loki chart in
# SimpleScalable mode against the COLD RustFS S3 bucket the ocp LokiStack
# uses. This is the vanilla-k8s port of igou-openshift's LokiStack
# `logging-loki` (loki.grafana.com/v1, size 1x.demo) — same object store,
# same 31d/compactor-enforced retention, but no operator/tenant-RBAC
# gateway (see gaps). SEPARATE from the existing single-binary `loki`
# component (filesystem, no S3): this one is the central store.
- name: loki
  includeCRDs: true
  releaseName: loki
  namespace: loki-scalable
  version: 7.1.0
  repo: https://grafana.github.io/helm-charts
  valuesInline:
    # SimpleScalable = read/write/backend targets (mirrors 1x.demo's split);
    # REQUIRES object storage, which is the whole point of this component.
    deploymentMode: SimpleScalable

    # Expand ${S3_ACCESS_KEY_ID}/${S3_SECRET_ACCESS_KEY} (injected below from
    # the loki-s3 ExternalSecret) in the rendered Loki config, so no S3
    # credential is ever inlined into git.
    global:
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-s3

    loki:
      # Single-tenant lab: the ocp tenant model (application/infrastructure/
      # audit gated by the LokiStack gateway) has no vanilla equivalent, so
      # ingest is unauthenticated in-cluster and fenced at the network layer.
      auth_enabled: false
      commonConfig:
        # Single-node k3s: one replica of each target, RF=1 (1x.demo parity).
        replication_factor: 1
      storage:
        type: s3
        # One `loki` bucket on rustfs-cold, same as the ocp LokiStack; chunks
        # and ruler share it under distinct key prefixes.
        bucketNames:
          chunks: loki
          ruler: loki
        s3:
          endpoint: https://truenas.igou.systems:20292
          region: us-east-1
          accessKeyId: "${S3_ACCESS_KEY_ID}"
          secretAccessKey: "${S3_SECRET_ACCESS_KEY}"
          s3ForcePathStyle: true
          insecure: false
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      # Retention is compactor-enforced (not bucket ILM), mirroring the ocp
      # LokiStack limits: 31d global, device syslog kept a season. The ocp
      # audit(14d) override has no equivalent here (no audit stream — see
      # gaps); the chatty-namespace 7d override is ported as-is.
      limits_config:
        retention_period: 744h # 31d
        retention_stream:
          - selector: '{job="syslog"}'
            priority: 10
            period: 2208h # 92d
          - selector: '{namespace=~"democratic-csi|intel-device-plugins|nvidia-gpu-operator"}'
            priority: 20
            period: 168h # 7d
        # ocp ingestion overrides (operator 4MB/s default dropped ~40% on
        # backlog replay). volume_enabled kept from chart default for
        # `logcli volume`/label-cardinality queries.
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        per_stream_rate_limit: 5MB
        per_stream_rate_limit_burst: 15MB
        volume_enabled: true
      compactor:
        retention_enabled: true
        delete_request_store: s3
        working_directory: /var/loki/compactor

    # Zero-out autoscaling to a single replica per target (1x.demo parity;
    # HPA min 2-3 makes no sense on one node) and put the two stateful
    # targets' WAL/cache on TrueNAS iSCSI.
    write:
      replicas: 1
      autoscaling:
        enabled: false
      persistence:
        storageClass: freenas-iscsi-ssd-csi
        size: 20Gi
    read:
      replicas: 1
      autoscaling:
        enabled: false
    backend:
      replicas: 1
      autoscaling:
        enabled: false
      persistence:
        storageClass: freenas-iscsi-ssd-csi
        size: 20Gi

    # nginx gateway fronts push/query on one endpoint (loki-gateway); this is
    # what the collector and log-gateway write to. Not to be confused with
    # the LokiStack tenant-RBAC gateway it replaces.
    gateway:
      enabled: true
      replicas: 1

    # Memcached tiers off at lab scale (same call as the single-binary
    # component); avoids the chart's multi-Gi memcached requests.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    lokiCanary:
      enabled: false
    test:
      enabled: false
