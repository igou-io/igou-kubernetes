---
# Wildcard cert for the trusted-lan tier domain (*.lan.igou.systems —
# federate.lan and any future intentionally-served trusted-lan hostname).
# DNS01 supports wildcards. Lives in the Gateway's namespace so the
# listener certificateRef needs no ReferenceGrant.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lan-tls
  namespace: nginx-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: wildcard-lan-tls
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  subject:
    organizations:
      - Igou
  privateKey:
    size: 4096
    algorithm: RSA
    encoding: PKCS1
    rotationPolicy: Always
  dnsNames:
    - "*.lan.igou.systems"
  issuerRef:
    kind: ClusterIssuer
    name: cluster-acme
