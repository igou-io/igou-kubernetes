---
# EDA (Event-Driven Ansible) event-stream webhook token + url. Staged for
# parity with the ocp component: the eda-github-issue route/receiver is NOT
# wired in the AlertmanagerConfig yet (the EDA pipeline is not set up here),
# but the backing secret is materialised so the route + receiver can be
# restored together in one edit. Same 1Password item the ocp cluster consumes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-eda-event-stream
  namespace: monitoring
  annotations:
    # ClusterSecretStore is not wired on rk8s yet (see README); tolerate the
    # missing store on first sync instead of blocking on a dry-run failure.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-aap
  target:
    name: alertmanager-eda-event-stream
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: aap-eda-alertmanager-event-stream-token
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: url
      remoteRef:
        key: aap-eda-alertmanager-event-stream-token
        property: url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
