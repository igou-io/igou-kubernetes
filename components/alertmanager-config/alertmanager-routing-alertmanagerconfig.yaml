---
# Global alert routing for the kube-prometheus-stack Alertmanager, adopted via
# alertmanagerSpec.alertmanagerConfiguration.name (components/
# kube-prometheus-stack). Before this the Alertmanager ran the chart's inert
# default config and rk8s alerts went NOWHERE.
#
# Deliberately minimal: the only notification service reachable from rk8s
# today is the hermes-sre am-relay on ocp (read-only SRE Hermes investigates
# and posts to #igoucloud-hermes-sre). The gotify / Slack / EDA receivers from
# the original igou-openshift port are omitted — none of those services or
# their secrets exist on this cluster; restore them together with their
# ExternalSecrets (see kustomization.yaml) when they do.
#
# The relay requires the hermes-sre-am-relay bearer token on every POST
# (hermes-sre-am-relay-externalsecret.yaml; same 1Password item as the ocp
# side) and answers 503 while Hermes is at its session limit, which
# Alertmanager retries — alerts queue rather than drop.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-routing
  namespace: monitoring
spec:
  route:
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    # Each delivery costs a full LLM investigation on the receiving side;
    # batch re-fires and do not re-deliver an unchanged group more than
    # twice a day (matches the ocp hermes-sre route).
    groupInterval: 30m
    repeatInterval: 12h
    receiver: 'null'
    routes:
      - matchers:
          - name: alertname
            value: Watchdog
            matchType: '='
        receiver: 'null'
      - matchers:
          - name: severity
            value: critical|warning
            matchType: '=~'
        receiver: hermes-sre
  receivers:
    - name: 'null'
    - name: hermes-sre
      webhookConfigs:
        - url: https://hermes-sre-am-relay.apps.ocp.igou.systems/
          sendResolved: true
          maxAlerts: 10
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: hermes-sre-am-relay
                key: token
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: '='
      targetMatch:
        - name: severity
          value: warning|info
          matchType: '=~'
      equal: [namespace, alertname]
    - sourceMatch:
        - name: severity
          value: warning
          matchType: '='
      targetMatch:
        - name: severity
          value: info
          matchType: '='
      equal: [namespace, alertname]
