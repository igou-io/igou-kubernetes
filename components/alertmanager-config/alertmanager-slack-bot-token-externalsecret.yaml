---
# Slack bot token for the chat.postMessage receivers. Same 1Password item the
# ocp cluster consumes (igou-openshift components/alertmanager-config), pulled
# ONLY the `password` field. The Connect provider's dataFrom.extract also
# surfaces the item's empty `notesPlain` field as an empty secret key (the SDK
# provider omitted empty fields; Connect does not), so we pin the single field
# via data.remoteRef rather than dataFrom.extract.
#
# The AlertmanagerConfig slackConfig.apiURL requires a SecretKeySelector, so we
# also stamp the (public, non-secret) chat.postMessage endpoint into an
# `api_url` key via a Merge template — the equivalent of the literal `api_url`
# the ocp raw alertmanager.yaml carried inline.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-bot-token
  namespace: monitoring
  annotations:
    # ClusterSecretStore is not wired on rk8s yet (see README); tolerate the
    # missing store on first sync instead of blocking on a dry-run failure.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-external-api-keys
  target:
    name: alertmanager-slack-bot-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      # Merge keeps the fetched `password` and adds the static endpoint.
      mergePolicy: Merge
      data:
        api_url: https://slack.com/api/chat.postMessage
  data:
    - secretKey: password
      remoteRef:
        key: slack_notification_password
        property: password
        # declared to match ESO CRD defaults → keeps ArgoCD Synced
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
