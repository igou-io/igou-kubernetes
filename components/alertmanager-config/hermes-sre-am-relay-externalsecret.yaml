---
# Bearer token for the hermes-sre am-relay on ocp; referenced by the
# AlertmanagerConfig's hermes-sre receiver. Same 1Password item
# (lab_rk8s/hermes-sre-am-relay) that backs the relay itself and the ocp
# alertmanager-main copy (igou-openshift).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-sre-am-relay
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-lab-rk8s
  target:
    name: hermes-sre-am-relay
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: hermes-sre-am-relay
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
